<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAVIO — Support</title>
  <link rel="icon" type="image/png" href="images/travio-favicon.png">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:auto; }
    .support-wrap { width:100%; max-width:480px; padding:24px; }
    .support-card { background:#0F1525; border:1px solid var(--border2); border-radius:20px; padding:28px 24px 32px; display:flex; flex-direction:column; gap:18px; }
    .support-back { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; margin-bottom:8px; font-family:'DM Sans',sans-serif; }
    .support-back:hover { color:var(--white); }
    .support-head h1 { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--white); margin-bottom:6px; }
    .support-head p { font-size:13px; color:var(--muted); line-height:1.6; }
    .support-success { background:rgba(0,229,160,0.07); border:1px solid rgba(0,229,160,0.2); border-radius:12px; padding:16px 18px; font-size:13px; color:var(--accent); line-height:1.6; display:none; }
  </style>
</head>
<body>
  <div class="support-wrap">
    <button class="support-back" onclick="history.back()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10 7H4M6 4L3 7l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Retour
    </button>
    <div class="support-card">
      <div class="support-head">
        <h1>
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" style="vertical-align:-3px;margin-right:5px;">
            <path d="M2 9V7a6 6 0 0112 0v2M2 9v3a2 2 0 002 2h1M14 9v3a2 2 0 01-2 2h-1M4 9v3a1 1 0 001 1h1v-4H4zM12 9v3a1 1 0 01-1 1h-1v-4h2z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Support Travio
        </h1>
        <p>Un bug, une question, un problème quelconque ? Décrivez-le clairement et notre équipe vous répondra dans les meilleurs délais.</p>
      </div>
      <div class="pdv-create-fields">
        <div class="pdv-field-group">
          <label>Type de demande <span class="req">*</span></label>
          <select class="pdv-select" id="supportType">
            <option value="">Sélectionner</option>
            <option value="bug">Bug technique</option>
            <option value="question">Question fonctionnelle</option>
            <option value="paiement">Problème de paiement</option>
            <option value="compte">Problème de compte</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div class="pdv-field-group">
          <label>Sujet <span class="req">*</span></label>
          <input type="text" class="pdv-input" id="supportSujet" placeholder="Ex : Impossible de créer un trajet">
        </div>
        <div class="pdv-field-group">
          <label>Description <span class="req">*</span></label>
          <textarea class="ob-textarea" id="supportMessage" rows="5" placeholder="Décrivez le problème en détail — que s'est-il passé exactement ? Depuis quand ?"></textarea>
        </div>
      </div>
      <button class="pdv-btn-next" id="supportSubmitBtn" onclick="submitSupportMessage()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px;">
          <path d="M2 14V2M2 14h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M6 5l4-3 4 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Envoyer au support
      </button>
      <div class="support-success" id="supportSuccess">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px;">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Message envoyé avec succès ! Notre équipe vous répondra sous 24h. Vous pouvez fermer cette page.
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="dashToast">
    <span class="toast-icon" id="dashToastIcon"></span>
    <span class="toast-msg" id="dashToastMsg"></span>
  </div>


  <script type="module" src="support.js"></script>
</body>
</html>
